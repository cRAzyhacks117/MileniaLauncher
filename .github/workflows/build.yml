name: Build launcher

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build launcher package
        shell: pwsh
        run: ./build.ps1 -JdkBin "$env:JAVA_HOME\bin"

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: MileniaLauncher
          path: dist/MileniaLauncher.zip
          if-no-files-found: error
